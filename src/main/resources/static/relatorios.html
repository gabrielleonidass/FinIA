<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Relatórios · FinIA</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<a class="pular" href="#conteudo">Pular para o conteúdo</a>
<div class="layout">
  <aside id="sidebar"></aside>
  <div class="principal">
    <header id="topo"></header>
    <main class="conteudo" id="conteudo">
      <section class="cartao">
        <form class="filtros" id="form">
          <div class="campo"><label for="tipo">Tipo de relatório</label>
            <select id="tipo" name="tipo"><option value="mensal">Mensal</option><option value="trimestral">Trimestral</option><option value="anual">Anual</option></select></div>
          <div class="campo"><label for="ref">Mês de referência</label><input type="month" id="ref" name="referencia"></div>
          <div class="acoes" style="margin-left:auto">
            <a class="btn btn-sec" id="btn-xlsx"></a>
            <a class="btn btn-primario" id="btn-pdf"></a>
          </div>
        </form>
      </section>

      <div><h2 id="titulo"></h2><p class="sub" id="subtitulo"></p></div>

      <section class="grade g-3">
        <div class="cartao kpi"><span class="kpi-rotulo">Receitas</span><span class="kpi-valor pos" id="k-rec">-</span><span class="kpi-extra" id="k-rec-v"></span></div>
        <div class="cartao kpi"><span class="kpi-rotulo">Despesas</span><span class="kpi-valor neg" id="k-desp">-</span><span class="kpi-extra" id="k-desp-v"></span></div>
        <div class="cartao kpi kpi-destaque"><span class="kpi-rotulo">Saldo do período</span><span class="kpi-valor" id="k-saldo">-</span><span class="kpi-extra" id="k-saldo-v"></span></div>
      </section>

      <section class="grade g-2">
        <div class="cartao">
          <div class="cartao-cab"><div><h2>Gastos por categoria</h2><p>Comparativo com o período anterior</p></div></div>
          <div class="tabela-wrap"><table>
            <thead><tr><th>Categoria</th><th class="num">Período</th><th class="num">Anterior</th><th class="num">Variação</th></tr></thead>
            <tbody id="cats"></tbody></table></div>
        </div>
        <div class="cartao">
          <div class="cartao-cab"><div><h2>Totais por mês</h2><p>Todos os meses do período</p></div></div>
          <div class="tabela-wrap"><table>
            <thead><tr><th>Mês</th><th class="num">Receitas</th><th class="num">Despesas</th><th class="num">Saldo</th></tr></thead>
            <tbody id="meses"></tbody></table></div>
        </div>
      </section>

      <section class="cartao">
        <div class="cartao-cab"><div><h2>Progresso das metas</h2></div></div>
        <div class="grade g-3" id="metas"></div>
      </section>
    </main>
  </div>
</div>
<script src="/js/app.js"></script>
<script>
  const F = FinIA;
  const ref = document.getElementById('ref');
  ref.value = F.mesAtual();
  document.getElementById('btn-xlsx').innerHTML = F.icone('baixar') + ' Exportar XLSX';
  document.getElementById('btn-pdf').innerHTML = F.icone('baixar') + ' Exportar PDF';
  const variacao = (v) => v === null || v === undefined ? '<span class="sub">-</span>' : `<span class="${v > 0 ? 'neg' : 'pos'}">${v > 0 ? '+' : ''}${String(v).replace('.', ',')}%</span>`;

  async function carregar() {
    const q = new URLSearchParams(F.dadosForm(document.getElementById('form')));
    document.getElementById('btn-xlsx').href = '/api/relatorios/exportar?formato=xlsx&' + q;
    document.getElementById('btn-pdf').href = '/api/relatorios/exportar?formato=pdf&' + q;
    const d = await F.get('/api/relatorios?' + q);
    document.getElementById('titulo').textContent = 'Relatório ' + d.tipo + ' · ' + d.periodo.rotulo;
    document.getElementById('subtitulo').textContent = `${F.data(d.periodo.inicio)} a ${F.data(d.periodo.fim)} · comparado a ${F.data(d.periodoAnterior.inicio)} a ${F.data(d.periodoAnterior.fim)}`;
    document.getElementById('k-rec').textContent = F.moeda(d.receitas);
    document.getElementById('k-desp').textContent = F.moeda(d.despesas);
    document.getElementById('k-saldo').textContent = F.moeda(d.saldo);
    const c = d.comparativo;
    document.getElementById('k-rec-v').innerHTML = 'anterior: ' + F.moeda(c.receitasAnterior);
    document.getElementById('k-desp-v').innerHTML = 'anterior: ' + F.moeda(c.despesasAnterior) + ' (' + variacao(c.variacaoDespesas) + ')';
    document.getElementById('k-saldo-v').textContent = 'anterior: ' + F.moeda(c.saldoAnterior);
    document.getElementById('cats').innerHTML = d.categorias.map(x => `<tr>
      <td><span class="ponto" style="background:${x.cor};margin-right:8px"></span>${F.esc(x.categoria)} <span class="sub">(${String(x.participacao).replace('.', ',')}%)</span></td>
      <td class="num">${F.moeda(x.total)}</td><td class="num sub">${F.moeda(x.anterior)}</td><td class="num">${variacao(x.variacao)}</td></tr>`).join('')
      || '<tr><td colspan="4" class="vazio">Sem despesas no período.</td></tr>';
    document.getElementById('meses').innerHTML = d.mensal.map(m => `<tr><td>${m.rotulo}</td><td class="num">${F.moeda(m.receitas)}</td>
      <td class="num">${F.moeda(m.despesas)}</td><td class="num ${m.saldo < 0 ? 'neg' : 'pos'}"><strong>${F.moeda(m.saldo)}</strong></td></tr>`).join('')
      + `<tr style="background:#f8fafc"><td><strong>Total</strong></td><td class="num"><strong>${F.moeda(d.receitas)}</strong></td><td class="num"><strong>${F.moeda(d.despesas)}</strong></td><td class="num"><strong>${F.moeda(d.saldo)}</strong></td></tr>`;
    document.getElementById('metas').innerHTML = d.metas.map(m => `<div>
      <div style="display:flex;justify-content:space-between"><strong>${F.esc(m.nome)}</strong><span class="badge ${F.rotuloStatusMeta[m.status][1]}">${F.rotuloStatusMeta[m.status][0]}</span></div>
      <div class="barra" style="margin:8px 0 4px"><span style="width:${m.percentual}%"></span></div>
      <span class="sub">${F.moeda(m.valorAcumulado)} de ${F.moeda(m.valorAlvo)} · ${m.percentual}%</span></div>`).join('');
  }
  document.getElementById('form').addEventListener('change', carregar);
  F.iniciar('relatorios', 'Relatórios', 'Relatórios mensais, trimestrais e anuais em PDF e Excel').then(carregar);
</script>
</body>
</html>
