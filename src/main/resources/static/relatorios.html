<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Relatórios · FinIA</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<main>
  <div class="cabecalho">
    <div>
      <h1>Relatórios</h1>
      <p class="subtitulo" id="subtitulo">Resumo do período para guardar ou compartilhar.</p>
    </div>
    <div class="filtros">
      <div class="campo"><label for="tipo">Relatório</label>
        <select id="tipo"><option value="mensal">Mensal</option><option value="trimestral">Trimestral</option><option value="anual">Anual</option></select></div>
      <div class="campo" id="campo-mes"><label for="mes">Mês</label><input type="month" id="mes"></div>
      <div class="campo" id="campo-tri" hidden><label for="tri">Trimestre</label>
        <select id="tri"><option value="1">1º (jan–mar)</option><option value="2">2º (abr–jun)</option><option value="3">3º (jul–set)</option><option value="4">4º (out–dez)</option></select></div>
      <div class="campo" id="campo-ano" hidden><label for="ano">Ano</label><input type="number" id="ano" min="2000" max="2100"></div>
      <button class="botao botao-claro" id="pdf">Exportar PDF</button>
      <button class="botao" id="excel">Exportar Excel (.xlsx)</button>
    </div>
  </div>

  <section class="grade grade-3 espaco">
    <div class="cartao numero"><small>Receitas</small><strong class="verde" id="receitas">-</strong></div>
    <div class="cartao numero"><small>Despesas</small><strong class="laranja" id="despesas">-</strong></div>
    <div class="cartao numero"><small>Saldo</small><strong id="saldo">-</strong></div>
  </section>

  <section class="grade grade-2 espaco">
    <div class="cartao">
      <h2>Gastos por categoria</h2>
      <table><thead><tr><th>Categoria</th><th class="valor">Total</th><th class="valor">%</th></tr></thead><tbody id="categorias"></tbody></table>
    </div>
    <div class="cartao">
      <h2 id="titulo-comparacao">Comparação com o período anterior</h2>
      <table><thead><tr><th></th><th class="valor" id="col-anterior">Anterior</th><th class="valor" id="col-atual">Atual</th><th class="valor">Variação</th></tr></thead><tbody id="comparacao"></tbody></table>
      <h2 style="margin-top:20px">Metas</h2>
      <ul class="lista-simples" id="metas"></ul>
    </div>
  </section>
</main>
<script src="/js/app.js"></script>
<script src="/js/xlsx-simples.js"></script>
<script>
  avisoPrototipo('RF11', 'Os números vêm do banco de dados. O PDF usa a impressão do navegador ("Salvar como PDF") e o Excel é um arquivo .xlsx gerado no navegador. O acesso do Consultor Financeiro com login próprio fica para a próxima versão.');

  const $ = id => document.getElementById(id);
  const MESES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
  let atual = null, anterior = null, rotulos = null;

  const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  const fimDoMes = (ano, mes) => new Date(ano, mes + 1, 0); // mes de 0 a 11

  /** Período escolhido e o período anterior equivalente (março -> fevereiro; 2º tri -> 1º tri; 2026 -> 2025). */
  function periodos() {
    const tipo = $('tipo').value;
    if (tipo === 'mensal') {
      const [a, m] = $('mes').value.split('-').map(Number);
      const ant = new Date(a, m - 2, 1);
      return {
        atual: [new Date(a, m - 1, 1), fimDoMes(a, m - 1)], anterior: [ant, fimDoMes(ant.getFullYear(), ant.getMonth())],
        nomes: [MESES[m - 1] + '/' + a, MESES[ant.getMonth()] + '/' + ant.getFullYear()], arquivo: $('mes').value,
      };
    }
    if (tipo === 'trimestral') {
      const a = Number($('ano').value), t = Number($('tri').value);
      const ta = t === 1 ? 4 : t - 1, aa = t === 1 ? a - 1 : a;
      return {
        atual: [new Date(a, (t - 1) * 3, 1), fimDoMes(a, t * 3 - 1)], anterior: [new Date(aa, (ta - 1) * 3, 1), fimDoMes(aa, ta * 3 - 1)],
        nomes: [`${t}º tri/${a}`, `${ta}º tri/${aa}`], arquivo: `${a}-T${t}`,
      };
    }
    const a = Number($('ano').value);
    return { atual: [new Date(a, 0, 1), new Date(a, 11, 31)], anterior: [new Date(a - 1, 0, 1), new Date(a - 1, 11, 31)],
      nomes: [String(a), String(a - 1)], arquivo: String(a) };
  }

  const url = ([de, ate]) => `/api/inicio?periodo=personalizado&de=${iso(de)}&ate=${iso(ate)}`;
  const variacao = (a, b) => a ? ((b - a) / Math.abs(a) * 100).toFixed(0) + '%' : '-';

  async function carregar() {
    const p = periodos();
    [atual, anterior] = await Promise.all([api(url(p.atual)), api(url(p.anterior))]);
    rotulos = p;
    $('subtitulo').textContent = `Relatório ${$('tipo').value} de ${p.nomes[0]}, comparado com ${p.nomes[1]}.`;
    $('col-atual').textContent = p.nomes[0];
    $('col-anterior').textContent = p.nomes[1];
    $('receitas').textContent = moeda(atual.receitas);
    $('despesas').textContent = moeda(atual.despesas);
    $('saldo').textContent = moeda(atual.saldo);
    $('categorias').innerHTML = atual.gastosPorCategoria.map(g => `
      <tr><td><span class="etiqueta"><span class="bolinha" style="background:${g.cor}"></span>${esc(g.categoria)}</span></td>
      <td class="valor">${moeda(g.total)}</td><td class="valor">${atual.despesas > 0 ? (g.total / atual.despesas * 100).toFixed(0) : 0}%</td></tr>`).join('')
      || '<tr><td colspan="3" class="vazio">Sem despesas no período.</td></tr>';
    const linha = (nome, a, b) => `<tr><td>${nome}</td><td class="valor">${moeda(a)}</td><td class="valor">${moeda(b)}</td><td class="valor">${variacao(a, b)}</td></tr>`;
    $('comparacao').innerHTML = linha('Receitas', anterior.receitas, atual.receitas) +
      linha('Despesas', anterior.despesas, atual.despesas) + linha('Saldo', anterior.saldo, atual.saldo);
    $('metas').innerHTML = atual.metas.map(m => `
      <li><span>${esc(m.nome)}</span><span>${m.percentual}% · ${moeda(m.valorGuardado)} de ${moeda(m.valorAlvo)}</span></li>`).join('');
  }

  $('pdf').onclick = () => window.print();
  $('excel').onclick = () => {
    const n = v => Number(v);
    const linhas = [
      ['Relatório FinIA', `${$('tipo').value} - ${rotulos.nomes[0]}`], [],
      ['Resumo', rotulos.nomes[1], rotulos.nomes[0]],
      ['Receitas', n(anterior.receitas), n(atual.receitas)],
      ['Despesas', n(anterior.despesas), n(atual.despesas)],
      ['Saldo', n(anterior.saldo), n(atual.saldo)], [],
      ['Categoria', 'Total'], ...atual.gastosPorCategoria.map(g => [g.categoria, n(g.total)]), [],
      ['Meta', 'Guardado', 'Valor da meta'], ...atual.metas.map(m => [m.nome, n(m.valorGuardado), n(m.valorAlvo)]),
    ];
    baixarXlsx(`relatorio-finia-${rotulos.arquivo}.xlsx`, 'Relatório', linhas);
  };

  function trocarTipo() {
    const tipo = $('tipo').value;
    $('campo-mes').hidden = tipo !== 'mensal';
    $('campo-tri').hidden = tipo !== 'trimestral';
    $('campo-ano').hidden = tipo === 'mensal';
    carregar();
  }

  (async () => {
    await montarTopo('relatorios');
    const d = new Date();
    $('mes').value = mesAtual();
    $('ano').value = d.getFullYear();
    $('tri').value = Math.floor(d.getMonth() / 3) + 1;
    $('tipo').onchange = trocarTipo;
    ['mes', 'tri', 'ano'].forEach(id => $(id).onchange = carregar);
    carregar();
  })();
</script>
</body>
</html>
