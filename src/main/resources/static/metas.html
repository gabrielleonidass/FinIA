<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Metas · FinIA</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<main>
  <div class="cabecalho">
    <div>
      <h1>Metas de economia</h1>
      <p class="subtitulo">Defina quanto quer juntar e até quando. O FinIA calcula quanto guardar por mês.</p>
    </div>
  </div>

  <!-- 1) Formulário de nova meta -->
  <section class="cartao espaco">
    <h2>Nova meta</h2>
    <form id="form" class="formulario">
      <div class="erro" id="erro" role="alert"></div>
      <div class="linha-form" style="grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1fr) auto">
        <div class="campo">
          <label for="nome">Nome da meta</label>
          <input id="nome" name="nome" required maxlength="100" placeholder="Ex.: Viagem de férias">
        </div>
        <div class="campo">
          <label for="valorAlvo">Valor (R$)</label>
          <input id="valorAlvo" name="valorAlvo" type="number" step="0.01" min="0.01" required>
        </div>
        <div class="campo">
          <label for="prazo">Prazo</label>
          <input id="prazo" name="prazo" type="date" required>
        </div>
        <div class="campo">
          <label for="taxaRendimento">Rendimento (% ao mês)</label>
          <input id="taxaRendimento" name="taxaRendimento" type="number" step="0.01" min="0" max="10" placeholder="Opcional">
        </div>
        <button class="botao" type="submit">Criar meta</button>
      </div>
    </form>
  </section>

  <!-- 2) Metas cadastradas -->
  <section class="grade grade-2" id="metas"></section>
</main>

<script src="/js/app.js"></script>
<script>
  async function carregar() {
    const metas = await api('/api/metas');
    document.getElementById('metas').innerHTML = metas.length === 0
      ? '<div class="cartao vazio">Você ainda não tem metas. Crie a primeira acima!</div>'
      : metas.map(m => `
        <article class="cartao">
          <div class="meta-topo">
            <div>
              <h2 style="margin:0">${esc(m.nome)}</h2>
              <small class="subtitulo">Prazo: ${dataBR(m.prazo)}</small>
            </div>
            ${m.concluida ? '<span class="selo">Concluída 🎉</span>' : `<strong>${m.percentual}%</strong>`}
          </div>
          <div class="barra ${m.concluida ? 'completa' : ''}"><div style="width:${m.percentual}%"></div></div>
          <div class="meta-info"><span>Guardado: <strong>${moeda(m.valorGuardado)}</strong></span><span>Meta: ${moeda(m.valorAlvo)}</span></div>
          ${m.concluida ? '' : `
            <p style="margin-top:10px">Faltam <strong>${moeda(m.falta)}</strong>. Guarde
              <strong class="verde">${moeda(m.valorPorMes)} por mês</strong> durante ${m.mesesRestantes} ${m.mesesRestantes === 1 ? 'mês' : 'meses'}.</p>
            ${m.taxaRendimento ? `<p class="dica">Considerando rendimento de ${String(m.taxaRendimento).replace('.', ',')}% ao mês sobre o valor guardado.</p>` : ''}`}
          <div class="meta-acoes">
            ${m.concluida ? '' : `
              <input type="number" step="0.01" min="0.01" placeholder="R$" id="valor-${m.id}" aria-label="Valor para guardar em ${esc(m.nome)}">
              <button class="botao botao-claro botao-pequeno" data-guardar="${m.id}">Guardar dinheiro</button>`}
            <button class="botao botao-perigo botao-pequeno" data-excluir="${m.id}" style="margin-left:auto">Excluir</button>
          </div>
        </article>`).join('');
  }

  document.getElementById('form').addEventListener('submit', async (evento) => {
    evento.preventDefault();
    try {
      const dados = dadosDoForm(evento.target);
      if (!dados.taxaRendimento) delete dados.taxaRendimento;
      await api('/api/metas', 'POST', dados);
      document.getElementById('erro').textContent = '';
      evento.target.reset();
      carregar();
    } catch (e) {
      document.getElementById('erro').textContent = e.message;
    }
  });

  document.getElementById('metas').addEventListener('click', async (e) => {
    const guardar = e.target.dataset.guardar;
    const excluir = e.target.dataset.excluir;
    try {
      if (guardar) {
        const valor = document.getElementById('valor-' + guardar).value;
        await api(`/api/metas/${guardar}/guardar`, 'POST', { valor });
        carregar();
      }
      if (excluir && confirm('Excluir esta meta?')) {
        await api('/api/metas/' + excluir, 'DELETE');
        carregar();
      }
    } catch (erro) {
      alert(erro.message);
    }
  });

  (async () => {
    await montarTopo('metas');
    carregar();
  })();
</script>
</body>
</html>
