<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Criar conta · FinIA</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="tela-entrada">
  <form class="caixa-entrada formulario" id="form">
    <div>
      <span class="logo">Fin<span>IA</span></span>
      <p class="subtitulo" style="text-align:center">Crie sua conta grátis</p>
    </div>
    <div class="erro" id="erro" role="alert"></div>
    <div class="campo">
      <label for="nome">Nome</label>
      <input id="nome" name="nome" required autocomplete="name">
    </div>
    <div class="campo">
      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" required autocomplete="email">
    </div>
    <div class="campo">
      <label for="cpf">CPF</label>
      <input id="cpf" name="cpf" required inputmode="numeric" maxlength="14" placeholder="000.000.000-00" autocomplete="off">
    </div>
    <div class="campo">
      <label for="senha">Senha</label>
      <input id="senha" name="senha" type="password" required autocomplete="new-password">
      <span class="dica">Mínimo 8 caracteres, com letra maiúscula, número e símbolo.</span>
    </div>
    <button class="botao" type="submit">Criar conta</button>
    <p class="rodape-entrada">Já tem conta? <a href="/">Entrar</a></p>
  </form>
</div>
<script src="/js/app.js"></script>
<script>
  // Máscara do CPF: 52998224725 -> 529.982.247-25
  document.getElementById('cpf').addEventListener('input', (e) => {
    const n = e.target.value.replace(/\D/g, '').slice(0, 11);
    e.target.value = n.replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d{1,2})$/, '$1-$2');
  });

  document.getElementById('form').addEventListener('submit', async (evento) => {
    evento.preventDefault();
    const botao = evento.target.querySelector('button');
    botao.disabled = true;
    try {
      await api('/api/auth/cadastro', 'POST', dadosDoForm(evento.target));
      location.href = '/inicio';
    } catch (e) {
      document.getElementById('erro').textContent = e.message;
    } finally {
      botao.disabled = false;
    }
  });
</script>
</body>
</html>
