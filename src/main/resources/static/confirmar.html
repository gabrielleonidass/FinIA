<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Confirmação de e-mail · FinIA</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<main class="auth-form" style="min-height:100vh">
  <div class="auth-caixa">
    <div class="marca" style="color:#0f172a;padding:0"><span class="marca-logo">Fi</span><strong>FinIA</strong></div>
    <h1>Confirmação de e-mail</h1>
    <div id="msg" role="status"><p class="sub">Validando seu link...</p></div>
    <a class="btn btn-primario" href="/">Ir para o login</a>
  </div>
</main>
<script src="/js/app.js"></script>
<script>
  const token = new URLSearchParams(location.search).get('token');
  FinIA.api('/api/auth/confirmar', { method: 'POST', body: { token }, publico: true })
    .then(r => document.getElementById('msg').innerHTML = `<div class="aviso aviso-ok">${FinIA.esc(r.mensagem)}</div>`)
    .catch(e => document.getElementById('msg').innerHTML = `<div class="aviso aviso-erro">${FinIA.esc(e.message)}</div>`);
</script>
</body>
</html>
