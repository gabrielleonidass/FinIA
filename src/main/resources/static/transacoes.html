<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Transações · FinIA</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<main>
  <div class="cabecalho">
    <div>
      <h1>Transações</h1>
      <p class="subtitulo">Registre o que entrou e o que saiu. A categoria é escolhida automaticamente.</p>
    </div>
  </div>

  <!-- 1) Formulário de nova transação -->
  <section class="cartao espaco">
    <h2>Nova transação</h2>
    <form id="form" class="formulario">
      <div class="erro" id="erro" role="alert"></div>
      <div class="linha-form">
        <div class="campo">
          <label for="descricao">Descrição</label>
          <input id="descricao" name="descricao" required maxlength="150" placeholder="Ex.: Uber para o trabalho">
        </div>
        <div class="campo">
          <label for="valor">Valor (R$)</label>
          <input id="valor" name="valor" type="number" step="0.01" min="0.01" required placeholder="0,00">
        </div>
        <div class="campo">
          <label for="tipo">Tipo</label>
          <select id="tipo" name="tipo">
            <option value="DESPESA">Despesa</option>
            <option value="RECEITA">Receita</option>
          </select>
        </div>
        <div class="campo">
          <label for="data">Data</label>
          <input id="data" name="data" type="date" required>
        </div>
        <div class="campo">
          <label for="categoria">Categoria</label>
          <select id="categoria" name="categoriaId"></select>
        </div>
        <button class="botao" type="submit">Salvar</button>
      </div>
      <p class="dica" id="sugestao" aria-live="polite"></p>
    </form>
  </section>

  <!-- 2) Lista do mês -->
  <section class="cartao">
    <div class="cabecalho" style="margin-bottom:8px">
      <h2 style="margin:0" id="titulo-lista">Transações do mês</h2>
      <input type="month" id="mes" aria-label="Escolher mês">
    </div>
    <div class="rolagem"><table>
      <thead>
        <tr><th>Data</th><th>Descrição</th><th>Categoria</th><th class="valor">Valor</th><th></th></tr>
      </thead>
      <tbody id="lista"></tbody>
    </table></div>
  </section>
</main>

<script src="/js/app.js"></script>
<script>
  let categorias = [];
  const form = document.getElementById('form');
  const campoMes = document.getElementById('mes');
  const campoTipo = document.getElementById('tipo');
  const campoCategoria = document.getElementById('categoria');
  const campoDescricao = document.getElementById('descricao');

  /** Opções de categoria só do tipo escolhido (receita ou despesa). */
  function opcoesDeCategoria(tipo, selecionada) {
    return categorias.filter(c => c.tipo === tipo)
      .map(c => `<option value="${c.id}" ${c.id === selecionada ? 'selected' : ''}>${esc(c.nome)}</option>`).join('');
  }

  function atualizarSelectDoForm() {
    campoCategoria.innerHTML = '<option value="">Automática (IA)</option>' + opcoesDeCategoria(campoTipo.value);
    mostrarSugestao();
  }

  /** Enquanto a pessoa digita, mostra qual categoria a IA vai escolher. */
  let espera;
  function mostrarSugestao() {
    clearTimeout(espera);
    const dica = document.getElementById('sugestao');
    if (!campoDescricao.value.trim() || campoCategoria.value) { dica.textContent = ''; return; }
    espera = setTimeout(async () => {
      const s = await api('/api/transacoes/sugestao?tipo=' + campoTipo.value +
        '&descricao=' + encodeURIComponent(campoDescricao.value));
      if (s.categoria) dica.innerHTML = `🤖 A IA vai classificar como <strong>${esc(s.categoria.nome)}</strong>. ${esc(s.motivo)}`;
    }, 300);
  }

  async function carregarLista() {
    document.getElementById('titulo-lista').textContent = 'Transações de ' + nomeDoMes(campoMes.value);
    const lista = await api('/api/transacoes?mes=' + campoMes.value);
    document.getElementById('lista').innerHTML = lista.length === 0
      ? '<tr><td colspan="5" class="vazio">Nenhuma transação neste mês.</td></tr>'
      : lista.map(t => `
        <tr>
          <td>${dataBR(t.data)}</td>
          <td>${esc(t.descricao)}</td>
          <td>
            <span class="etiqueta">
              <span class="bolinha" style="background:${t.categoria.cor}"></span>
              <select data-id="${t.id}" class="trocar-categoria" aria-label="Categoria de ${esc(t.descricao)}">
                ${opcoesDeCategoria(t.tipo, t.categoria.id)}
              </select>
              ${t.categoriaAutomatica ? '<span class="ia" title="Categoria escolhida automaticamente">IA</span>' : ''}
            </span>
          </td>
          <td class="valor ${t.tipo === 'RECEITA' ? 'verde' : 'laranja'}">${t.tipo === 'RECEITA' ? '+' : '-'} ${moeda(t.valor)}</td>
          <td style="text-align:right"><button class="botao botao-perigo botao-pequeno" data-excluir="${t.id}">Excluir</button></td>
        </tr>`).join('');
  }

  // Salvar nova transação
  form.addEventListener('submit', async (evento) => {
    evento.preventDefault();
    const dados = dadosDoForm(form);
    if (!dados.categoriaId) delete dados.categoriaId; // vazio = deixa a IA escolher
    try {
      await api('/api/transacoes', 'POST', dados);
      document.getElementById('erro').textContent = '';
      form.reset();
      document.getElementById('data').value = hoje();
      atualizarSelectDoForm();
      campoMes.value = dados.data.substring(0, 7);
      carregarLista();
    } catch (e) {
      document.getElementById('erro').textContent = e.message;
    }
  });

  // Trocar categoria ou excluir direto na tabela
  document.getElementById('lista').addEventListener('change', async (e) => {
    if (!e.target.classList.contains('trocar-categoria')) return;
    await api(`/api/transacoes/${e.target.dataset.id}/categoria`, 'PUT', { categoriaId: e.target.value });
    carregarLista();
  });
  document.getElementById('lista').addEventListener('click', async (e) => {
    const id = e.target.dataset.excluir;
    if (id && confirm('Excluir esta transação?')) {
      await api('/api/transacoes/' + id, 'DELETE');
      carregarLista();
    }
  });

  (async () => {
    await montarTopo('transacoes');
    categorias = await api('/api/categorias');
    document.getElementById('data').value = hoje();
    campoMes.value = mesAtual();
    atualizarSelectDoForm();
    campoTipo.onchange = atualizarSelectDoForm;
    campoCategoria.onchange = mostrarSugestao;
    campoDescricao.oninput = mostrarSugestao;
    campoMes.onchange = carregarLista;
    carregarLista();
  })();
</script>
</body>
</html>
