<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar · FinIA</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="tela-entrada">
  <form class="caixa-entrada formulario" id="form">
    <div>
      <span class="logo">Fin<span>IA</span></span>
      <p class="subtitulo" style="text-align:center">Suas finanças organizadas automaticamente</p>
    </div>
    <div class="erro" id="erro" role="alert"></div>
    <div class="campo">
      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" required autocomplete="email" value="demo@finia.com">
    </div>
    <div class="campo">
      <label for="senha">Senha</label>
      <input id="senha" name="senha" type="password" required autocomplete="current-password" value="Demo@1234">
    </div>
    <button class="botao" type="submit">Entrar</button>
    <p class="rodape-entrada">Não tem conta? <a href="/cadastro">Cadastre-se</a></p>
    <p class="demo">Conta de teste: <strong>demo@finia.com</strong> / <strong>Demo@1234</strong></p>
  </form>
</div>
<script src="/js/app.js"></script>
<script>
  document.getElementById('form').addEventListener('submit', async (evento) => {
    evento.preventDefault();
    const botao = evento.target.querySelector('button');
    botao.disabled = true;
    try {
      await api('/api/auth/login', 'POST', dadosDoForm(evento.target));
      location.href = '/inicio';
    } catch (e) {
      document.getElementById('erro').textContent = e.message;
    } finally {
      botao.disabled = false;
    }
  });
</script>
</body>
</html>
