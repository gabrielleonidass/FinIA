<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alertas · FinIA</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<main>
  <div class="cabecalho">
    <div>
      <h1>Alertas</h1>
      <p class="subtitulo">Avisos sobre gastos fora do normal, orçamentos, faturas e metas.</p>
    </div>
    <button class="botao botao-claro" id="todas">Marcar todas como lidas</button>
  </div>

  <section class="grade grade-2">
    <div class="cartao">
      <h2>Últimos alertas</h2>
      <ul class="lista-simples" id="lista"></ul>
    </div>
    <div class="cartao">
      <h2>O que você quer receber</h2>
      <ul class="lista-simples" id="prefs"></ul>
    </div>
  </section>
</main>
<script src="/js/app.js"></script>
<script>
  avisoPrototipo('RF08', 'Os alertas abaixo são exemplos. O envio real por notificação ou e-mail fica para a próxima versão.');

  let alertas = [
    { icone: '⚠️', titulo: 'Gasto fora do normal', texto: 'R$ 386,75 no Supermercado Assaí, bem acima da sua média nesse lugar.', quando: 'hoje', lido: false },
    { icone: '📊', titulo: 'Orçamento quase no limite', texto: 'Você já usou 85% do orçamento de Alimentação deste mês.', quando: 'ontem', lido: false },
    { icone: '💳', titulo: 'Fatura vence em 3 dias', texto: 'Fatura do Nubank (R$ 842,35) vence no dia 15.', quando: 'há 2 dias', lido: false },
    { icone: '🎯', titulo: 'Meta em risco', texto: 'No ritmo atual, a Reserva de emergência vai atrasar 2 meses.', quando: 'há 5 dias', lido: true },
    { icone: '✅', titulo: 'Meta concluída', texto: 'Parabéns! Você completou a meta Notebook novo.', quando: 'há 1 semana', lido: true },
  ];
  const prefs = [
    { nome: 'Gasto fora do normal', ligado: true, canal: 'Notificação' },
    { nome: 'Orçamento em 80% e 100%', ligado: true, canal: 'Notificação' },
    { nome: 'Fatura perto do vencimento', ligado: true, canal: 'E-mail' },
    { nome: 'Meta em risco', ligado: false, canal: 'E-mail' },
  ];

  function desenhar() {
    document.getElementById('lista').innerHTML = alertas.map((a, i) => `
      <li style="${a.lido ? 'opacity:.6' : ''}">
        <div style="display:flex;gap:12px"><span style="font-size:1.4rem">${a.icone}</span>
          <div><strong>${esc(a.titulo)}</strong>${a.lido ? '' : ' <span class="selo selo-alerta">novo</span>'}<br>
          <span class="subtitulo">${esc(a.texto)}</span><br><small class="subtitulo">${a.quando}</small></div></div>
        ${a.lido ? '' : `<button class="botao botao-claro botao-pequeno" data-ler="${i}">Lido</button>`}
      </li>`).join('');
    document.getElementById('prefs').innerHTML = prefs.map((p, i) => `
      <li><label class="chave"><input type="checkbox" data-pref="${i}" ${p.ligado ? 'checked' : ''}> ${esc(p.nome)}</label>
        <select data-canal="${i}" style="width:auto" aria-label="Canal de ${esc(p.nome)}">
          ${['Notificação', 'E-mail'].map(c => `<option ${c === p.canal ? 'selected' : ''}>${c}</option>`).join('')}
        </select></li>`).join('');
  }

  document.getElementById('lista').onclick = e => { if (e.target.dataset.ler) { alertas[e.target.dataset.ler].lido = true; desenhar(); } };
  document.getElementById('todas').onclick = () => { alertas.forEach(a => a.lido = true); desenhar(); };
  document.getElementById('prefs').onchange = e => {
    if (e.target.dataset.pref) prefs[e.target.dataset.pref].ligado = e.target.checked;
    if (e.target.dataset.canal) prefs[e.target.dataset.canal].canal = e.target.value;
    aviso('Preferência atualizada.');
  };

  montarTopo('alertas');
  desenhar();
</script>
</body>
</html>
